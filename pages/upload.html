<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Mod - JustMod</title>
<link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
<h1>⬆️ Upload Mod</h1>
<p>Share your Minecraft creation</p>
</header>

<section class="hero">

<input id="name" placeholder="Mod Name">

<br><br>

<input id="version" placeholder="Minecraft Version">

<br><br>

<textarea id="description" placeholder="Description"></textarea>

<br><br>

<input id="file" type="file" accept=".mcaddon,.mcpack,.mcworld">

<br><br>

<button class="download" onclick="uploadMod()">
Upload
</button>

</section>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase.js"></script>
<script src="../script.js"></script>

</body>
</html>
